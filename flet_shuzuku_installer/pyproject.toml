[project]
name = "flet-shizuku-installer"
version = "0.1.0"
description = "Flet extension for installing APKs via Shizuku/Dhizuku"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.flet.extension]
name = "flet_shizuku_installer"
